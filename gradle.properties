android.useAndroidX=true

# Aumentar el tamaño de la memoria para el proceso de Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Asegurar que el compilador de Kotlin tenga suficiente memoria propia
kotlin.daemon.jvmargs=-Xmx2048m

org.gradle.parallel=false
org.gradle.workers.max=2
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
org.gradle.configuration-cache=true

# Optimization suggested by build logs
android.dependency.excludeLibraryComponentsFromConstraints=true
